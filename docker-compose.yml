services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurelens
      POSTGRES_USER: procurelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurelens -d procurelens"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - procurelens-data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://procurelens:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/procurelens
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  procurelens-data:
